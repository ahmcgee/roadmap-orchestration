<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1560" viewBox="0 0 1920 1560" role="img" aria-labelledby="title desc">
<title id="title">Detailed arc process in BPMN notation</title><desc id="desc">Three pools: owner, root architect and executor. The owner confirms the vision, answers owner-only questions and acknowledges the brief. The architect authors the Phase 0 pack, supervises through a leased watch and closes out. The executor runs each ready unit through pre-build review, build, certification, gate and candidate publication, with fix rounds and diagnosis, then judges milestones and audits the campaign. Rules and limits are in docs/how-an-arc-runs.md.</desc>
