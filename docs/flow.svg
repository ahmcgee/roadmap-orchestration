<rect x="540" y="330" width="340" height="100" rx="10" fill="#f0f7ff" class="task"/>
<text x="710.0" y="361.0" class="label" text-anchor="middle"><tspan x="710.0" dy="0">Leased watch: digest → decide</tspan><tspan x="710.0" dy="24">Export → edit → CAS apply</tspan><tspan x="710.0" dy="24">Steer · note · witness · dismiss · ack id</tspan></text>
