<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1954" viewBox="0 0 1100 1954" role="img" aria-labelledby="title desc">
<title id="title">How a roadmap-orchestrator arc runs</title>
<desc id="desc">A swimlane flowchart in three lanes: you (the owner), the architect (Claude in your session, running the orchestrate and vision skills) and the executor (a detached Node process that runs unattended and calls models for judgment). It runs in four phases: a one-time bootstrap where you write the target state and confirm the vision; Phase 0 each arc, where the architect plans the arc and starts the executor; the unattended run, where the executor builds, tests, reviews and merges units in parallel while the architect adjudicates what it hands over; and completion, where the architect checks in with you, opens a stacked PR and either chains into the next arc or stops.</desc>
<style>
svg { 
  --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f;
  --ow:#b45309; --ow-fill:#fff7ed; --ow-lane:#fffaf3;
  --ar:#4338ca; --ar-fill:#eef2ff; --ar-lane:#f7f8ff;
  --ex:#047857; --ex-fill:#ecfdf5; --ex-lane:#f5fcf8; --step:#ffffff;
  --chip:#7c3aed; --chip-fg:#ffffff; --note:#f6f8fa; }
@media (prefers-color-scheme: dark) { svg { 
  --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681;
  --ow:#f59e0b; --ow-fill:#2b1d0a; --ow-lane:#17130c;
  --ar:#a5b4fc; --ar-fill:#1e1b4b; --ar-lane:#12122a;
  --ex:#34d399; --ex-fill:#0b2a1f; --ex-lane:#0c1a15; --step:#0d1117;
  --chip:#a78bfa; --chip-fg:#0d1117; --note:#161b22; } }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: var(--fg); }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
.bg { fill: var(--bg); }
.h1 { font-size: 22px; font-weight: 700; }
.sub, .lg, .ls { font-size: 13px; fill: var(--muted); }
.lt { font-size: 15px; font-weight: 700; }
.lt.ow { fill: var(--ow); } .lt.ar { fill: var(--ar); } .lt.ex { fill: var(--ex); }
.lane.ow { fill: var(--ow-lane); } .lane.ar { fill: var(--ar-lane); } .lane.ex { fill: var(--ex-lane); }
.box rect { stroke-width: 1.5; }
.box.ow rect { fill: var(--ow-fill); stroke: var(--ow); }
.box.ar rect { fill: var(--ar-fill); stroke: var(--ar); }
.box.ex rect { fill: var(--ex-fill); stroke: var(--ex); }
.box.step rect { fill: var(--step); stroke: var(--ex); stroke-width: 1; }
.box.note rect { fill: var(--note); stroke: var(--line); stroke-dasharray: 4 3; }
.box.note .t { fill: var(--muted); }
.t { font-size: 14px; font-weight: 600; }
.t.ex { fill: var(--ex); }
.b { font-size: 13px; }
.chip, .box rect.chip { fill: var(--chip); stroke: none; }
.chipt { font-size: 11px; font-weight: 600; fill: var(--chip-fg); }
.arr { fill: none; stroke: var(--line); stroke-width: 1.6; }
.arr.dash { stroke-dasharray: 5 4; }
#ah path { fill: var(--line); }
.al { font-size: 12px; fill: var(--muted); font-style: italic; }
.band { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.bandpill { fill: var(--fg); }
.bandt { font-size: 12px; font-weight: 700; fill: var(--bg); letter-spacing: 0.06em; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" width="1100" height="1954"/>
<text class="h1" x="24" y="40">How a roadmap-orchestrator arc runs</text>
<text class="sub" x="24" y="64">Who does what, from target-state documents to merged pull requests. Read top to bottom; the arc loop repeats until you or the vision say stop.</text>
<g class="box ow"><rect x="24" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="48" y="97">You: a person</text>
<g class="box ar"><rect x="166.3" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="190.3" y="97">Architect: AI, in your Claude Code session</text>
<g class="box ex"><rect x="514.5" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="538.5" y="97">Executor: autonomous code, unattended</text>
<rect class="chip" x="827.2" y="83" width="58" height="18" rx="9"/><text class="chipt" x="856.2" y="96" text-anchor="middle">model</text>
<text class="lg" x="893.2" y="97">the executor calls a model</text>
<rect class="lane ow" x="16" y="118" width="288" height="1826" rx="12"/>
<text class="lt ow" x="28" y="142">You, the owner</text>
<text class="ls" x="28" y="160">set the target, confirm, answer, merge</text>
<rect class="lane ar" x="332" y="118" width="356" height="1826" rx="12"/>
<text class="lt ar" x="344" y="142">Architect: Claude session</text>
<text class="ls" x="344" y="160">the orchestrate and vision skills</text>
<rect class="lane ex" x="716" y="118" width="368" height="1826" rx="12"/>
<text class="lt ex" x="728" y="142">Executor: detached Node process</text>
<text class="ls" x="728" y="160">owns processes, git, locks; calls models</text>
<line class="band" x1="16" y1="186" x2="1084" y2="186"/>
<rect class="bandpill" x="16" y="174" width="260.79999999999995" height="24" rx="12"/>
<text class="bandt" x="30" y="190.5">1  ONCE PER REPO: BOOTSTRAP</text>
<g class="box ow">
<rect x="24" y="214" width="272" height="91" rx="8"/>
<text class="t" x="36" y="239">Write the target state</text>
<text class="b" x="36" y="258">Detailed documents of what the</text>
<text class="b" x="36" y="275">product must become: the corpus.</text>
<text class="b" x="36" y="292">Install the plugin, run <tspan class="mono">/vision</tspan>.</text>
</g>
<g class="box ar">
<rect x="340" y="214" width="340" height="108" rx="8"/>
<text class="t" x="352" y="239">Distil the vision</text>
<text class="b" x="352" y="258">A dialogue, one question at a time:</text>
<text class="b" x="352" y="275">hypotheses for you to knock down,</text>
<text class="b" x="352" y="292">scenes, costs, ranked trade-offs. Plays</text>
<text class="b" x="352" y="309">back decisions it would make for you.</text>
</g>
<path class="arr" d="M296 259.5 H338" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="348" width="272" height="108" rx="8"/>
<text class="t" x="36" y="373">Confirm the vision</text>
<text class="b" x="36" y="392">Say an explicit “confirmed”. Set K:</text>
<text class="b" x="36" y="409">how many arcs may run past your last</text>
<text class="b" x="36" y="426">acknowledged check-in. Pick the</text>
<text class="b" x="36" y="443">first slice of the vision to build.</text>
</g>
<path class="arr" d="M340 308 H318 V366 H298" marker-end="url(#ah)"/>
<g class="box ar">
<rect x="340" y="348" width="340" height="108" rx="8"/>
<text class="t" x="352" y="373">Bootstrap the repo</text>
<text class="b" x="352" y="392">Compile <tspan class="mono">.roadmap/vision.json</tspan>, write</text>
<text class="b" x="352" y="409">the corpus guide, check the issue</text>
<text class="b" x="352" y="426">policy, commit <tspan class="mono">.roadmap/</tspan> on a work</text>
<text class="b" x="352" y="443">branch.</text>
</g>
<path class="arr" d="M296 438 H338" marker-end="url(#ah)"/>
<g class="box note">
<rect x="724" y="214" width="352" height="108" rx="8"/>
<text class="t" x="736" y="239">Not running yet</text>
<text class="b" x="736" y="258">Its CLI checks what the architect</text>
<text class="b" x="736" y="275">writes: the vision record, the issue</text>
<text class="b" x="736" y="292">policy (public repos must restrict</text>
<text class="b" x="736" y="309">who can open issues).</text>
</g>
<line class="band" x1="16" y1="496" x2="1084" y2="496"/>
<rect class="bandpill" x="16" y="484" width="306.79999999999995" height="24" rx="12"/>
<text class="bandt" x="30" y="500.5">2  EACH ARC: PHASE 0, IN SESSION</text>
<g class="box ar">
<rect x="340" y="524" width="340" height="210" rx="8"/>
<text class="t" x="352" y="549">Plan the arc (Phase 0)</text>
<text class="b" x="352" y="568">Subagents do the heavy reading.</text>
<text class="b" x="352" y="585">• Curate the corpus: every normative</text>
<text class="b" x="365" y="602">claim becomes one rule, <tspan class="mono">T-n</tspan></text>
<text class="b" x="352" y="619">• Pin it; extract testable obligations,</text>
<text class="b" x="365" y="636">each with its witness tests</text>
<text class="b" x="352" y="653">• Rank open questions <tspan class="mono">P-n</tspan>, each with</text>
<text class="b" x="365" y="670">the working assumption it acts on</text>
<text class="b" x="352" y="687">• Settle debt, amendments, issues</text>
<text class="b" x="352" y="704">• Choose the slice; write the plan</text>
<text class="b" x="365" y="721">and one spec per unit</text>
</g>
<g class="box note">
<rect x="24" y="524" width="272" height="91" rx="8"/>
<text class="t" x="36" y="549">Nothing needed from you</text>
<text class="b" x="36" y="568">Questions the vision cannot settle</text>
<text class="b" x="36" y="585">wait for the next check-in, each</text>
<text class="b" x="36" y="602">with a working assumption meanwhile.</text>
</g>
<g class="box ar">
<rect x="340" y="752" width="340" height="74" rx="8"/>
<text class="t" x="352" y="777">Check, then start</text>
<text class="b" x="352" y="796"><tspan class="mono">roadmap phase0 check</tspan> until clean,</text>
<text class="b" x="352" y="813">then <tspan class="mono">roadmap start</tspan>.</text>
</g>
<path class="arr" d="M510 734 V750" marker-end="url(#ah)"/>
<g class="box ex">
<rect x="724" y="742" width="352" height="91" rx="8"/>
<text class="t" x="736" y="767">Refuse, or launch</text>
<text class="b" x="736" y="786">Validates every input. On start it runs</text>
<text class="b" x="736" y="803">detached under a supervisor, smokes</text>
<text class="b" x="736" y="820">each model backend, takes the host lock.</text>
</g>
<path class="arr" d="M680 789 H722" marker-end="url(#ah)"/>
<line class="band" x1="16" y1="873" x2="1084" y2="873"/>
<rect class="bandpill" x="16" y="861" width="343.59999999999997" height="24" rx="12"/>
<text class="bandt" x="30" y="877.5">3  THE ARC RUNS UNATTENDED, FOR DAYS</text>
<g class="box ex">
<rect x="724" y="901" width="352" height="74" rx="8"/>
<text class="t" x="736" y="926">Pack review</text>
<rect class="chip" x="1010" y="909" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="922" text-anchor="middle">model</text>
<text class="b" x="736" y="945">Reviews the whole plan before any</text>
<text class="b" x="736" y="962">unit is admitted.</text>
</g>
<g class="box ex"><rect x="724" y="997" width="352" height="330" rx="8"/></g>
<text class="t ex" x="736" y="1021">Each unit, in parallel across the DAG</text>
<g class="box step"><rect x="740" y="1035" width="262" height="44" rx="6"/></g>
<text class="t" x="750" y="1053">Plan-check</text>
<text class="b" x="750" y="1070">is the spec feasible and sound?</text>
<rect class="chip" x="938" y="1041" width="58" height="18" rx="9"/><text class="chipt" x="967" y="1054" text-anchor="middle">model</text>
<g class="box step"><rect x="740" y="1093" width="262" height="44" rx="6"/></g>
<text class="t" x="750" y="1111">Build</text>
<text class="b" x="750" y="1128">an implementer in its own worktree</text>
<rect class="chip" x="938" y="1099" width="58" height="18" rx="9"/><text class="chipt" x="967" y="1112" text-anchor="middle">model</text>
<path class="arr" d="M780 1079 V1091" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="1151" width="262" height="44" rx="6"/></g>
<text class="t" x="750" y="1169">Lanes</text>
<text class="b" x="750" y="1186">tests, witnesses, mutation smoke</text>
<path class="arr" d="M780 1137 V1149" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="1209" width="262" height="44" rx="6"/></g>
<text class="t" x="750" y="1227">Gate</text>
<text class="b" x="750" y="1244">a fresh-context review of the diff</text>
<rect class="chip" x="938" y="1215" width="58" height="18" rx="9"/><text class="chipt" x="967" y="1228" text-anchor="middle">model</text>
<path class="arr" d="M780 1195 V1207" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="1267" width="262" height="44" rx="6"/></g>
<text class="t" x="750" y="1285">Publish</text>
<text class="b" x="750" y="1302">merge candidate, suite, fast-forward</text>
<path class="arr" d="M780 1253 V1265" marker-end="url(#ah)"/>
<path class="arr" d="M1002 1173 H1028 V1115 H1004" marker-end="url(#ah)"/>
<line class="arr" x1="1002" y1="1231" x2="1028" y2="1231"/>
<line class="arr" x1="1028" y1="1231" x2="1028" y2="1173"/>
<text class="al" x="1034" y="1149">red:</text>
<text class="al" x="1034" y="1163">fix</text>
<text class="al" x="1034" y="1177">round</text>
<path class="arr" d="M764 975 V995" marker-end="url(#ah)"/>
<g class="box ex">
<rect x="724" y="1347" width="352" height="91" rx="8"/>
<text class="t" x="736" y="1372">Checkpoint</text>
<rect class="chip" x="1010" y="1355" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="1368" text-anchor="middle">model</text>
<text class="b" x="736" y="1391">Every few merges: audits the arc</text>
<text class="b" x="736" y="1408">against the vision, admits repair or</text>
<text class="b" x="736" y="1425">opportunity units, records divergences.</text>
</g>
<g class="box ex">
<rect x="724" y="1452" width="352" height="74" rx="8"/>
<text class="t" x="736" y="1477">Flow loop</text>
<rect class="chip" x="1010" y="1460" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="1473" text-anchor="middle">model</text>
<text class="b" x="736" y="1496">Names the bottleneck; proposes at</text>
<text class="b" x="736" y="1513">most one change to how the arc runs.</text>
</g>
<g class="box note">
<rect x="724" y="1540" width="352" height="74" rx="8"/>
<text class="t" x="736" y="1565">Self-healing</text>
<text class="b" x="736" y="1584">A crashed executor is restarted by its</text>
<text class="b" x="736" y="1601">supervisor and recovers from disk.</text>
</g>
<g class="box ar">
<rect x="340" y="901" width="340" height="91" rx="8"/>
<text class="t" x="352" y="926">Wait on <tspan class="mono">watch --actionable</tspan></text>
<text class="b" x="352" y="945">Wakes only on key events: a new item,</text>
<text class="b" x="352" y="962">a merge, a park, completion, an answer;</text>
<text class="b" x="352" y="979">plus a 30-minute heartbeat.</text>
</g>
<g class="box ar">
<rect x="340" y="1061" width="340" height="108" rx="8"/>
<text class="t" x="352" y="1086">Adjudicate needs-user items</text>
<text class="b" x="352" y="1105">Parked units, pack-review findings,</text>
<text class="b" x="352" y="1122">checkpoint bundle requests, flow</text>
<text class="b" x="352" y="1139">proposals. Reads the evidence in</text>
<text class="b" x="352" y="1156">full, then acts or acknowledges.</text>
</g>
<g class="box ar">
<rect x="340" y="1195" width="340" height="108" rx="8"/>
<text class="t" x="352" y="1220">Steer through levers</text>
<text class="b" x="352" y="1239"><tspan class="mono">apply</tspan> a revised plan or spec,</text>
<text class="b" x="352" y="1256">re-enter a unit, <tspan class="mono">steer</tspan>, <tspan class="mono">reverse</tspan> a</text>
<text class="b" x="352" y="1273">divergence, <tspan class="mono">pause</tspan>, <tspan class="mono">resume</tspan>, <tspan class="mono">stop</tspan>.</text>
<text class="b" x="352" y="1290">Never runs a backend or edits state.</text>
</g>
<path class="arr" d="M510 992 V1059" marker-end="url(#ah)"/>
<path class="arr" d="M510 1169 V1193" marker-end="url(#ah)"/>
<path class="arr dash" d="M724 1115 H682" marker-end="url(#ah)"/>
<text class="al" x="690" y="1109" text-anchor="start">items</text>
<path class="arr" d="M680 1249 H722" marker-end="url(#ah)"/>
<text class="al" x="690" y="1243" text-anchor="start">apply</text>
<g class="box ow">
<rect x="24" y="901" width="272" height="57" rx="8"/>
<text class="t" x="36" y="926">Away</text>
<text class="b" x="36" y="945">Nothing to do while the arc runs.</text>
</g>
<g class="box ow">
<rect x="24" y="1061" width="272" height="74" rx="8"/>
<text class="t" x="36" y="1086">Answer a question, any time</text>
<text class="b" x="36" y="1105"><tspan class="mono">roadmap answer P-n --text …</tspan></text>
<text class="b" x="36" y="1122">It applies at once, even mid-arc.</text>
</g>
<path class="arr dash" d="M296 1098 H338" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="1203" width="272" height="74" rx="8"/>
<text class="t" x="36" y="1228">Always asked first</text>
<text class="b" x="36" y="1247">Anything irreversible, costing over</text>
<text class="b" x="36" y="1264">$10, or with legal ramifications.</text>
</g>
<path class="arr dash" d="M340 1240 H298" marker-end="url(#ah)"/>
<line class="band" x1="16" y1="1654" x2="1084" y2="1654"/>
<rect class="bandpill" x="16" y="1642" width="352.79999999999995" height="24" rx="12"/>
<text class="bandt" x="30" y="1658.5">4  ARC COMPLETE: CHECK IN, THEN CHAIN</text>
<g class="box ex">
<rect x="724" y="1682" width="352" height="108" rx="8"/>
<text class="t" x="736" y="1707">Arc complete</text>
<text class="b" x="736" y="1726">Every unit merged, every obligation</text>
<text class="b" x="736" y="1743">holding on the head, nothing left the</text>
<text class="b" x="736" y="1760">checkpoint would change. On <tspan class="mono">roadmap pr</tspan></text>
<text class="b" x="736" y="1777">it pushes the branch, opens a stacked PR.</text>
</g>
<g class="box ar">
<rect x="340" y="1682" width="340" height="91" rx="8"/>
<text class="t" x="352" y="1707">Check in</text>
<text class="b" x="352" y="1726"><tspan class="mono">roadmap brief</tspan>, a short preface, and</text>
<text class="b" x="352" y="1743">numbered questions, each with the</text>
<text class="b" x="352" y="1760">assumption it acts on if unanswered.</text>
</g>
<path class="arr dash" d="M724 1727.5 H682" marker-end="url(#ah)"/>
<text class="al" x="690" y="1721.5" text-anchor="start">wake</text>
<g class="box ow">
<rect x="24" y="1682" width="272" height="91" rx="8"/>
<text class="t" x="36" y="1707">Read, answer, acknowledge</text>
<text class="b" x="36" y="1726">Ack the brief: arcs before it stop</text>
<text class="b" x="36" y="1743">counting toward K. Optionally</text>
<text class="b" x="36" y="1760">recalibrate the vision (<tspan class="mono">/vision</tspan>).</text>
</g>
<path class="arr dash" d="M340 1727.5 H298" marker-end="url(#ah)"/>
<g class="box ar">
<rect x="340" y="1799" width="340" height="125" rx="8"/>
<text class="t" x="352" y="1824">Next arc, or stop</text>
<text class="b" x="352" y="1843">Continue without waiting for answers,</text>
<text class="b" x="352" y="1860">up to K unacknowledged arcs: the next</text>
<text class="b" x="352" y="1877">slice comes from the census. Stop at K,</text>
<text class="b" x="352" y="1894">when the vision is silent, or on your word.</text>
<text class="b" x="352" y="1911">↺ Continuing goes back to step 2.</text>
</g>
<path class="arr" d="M510 1773 V1797" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="1819" width="272" height="74" rx="8"/>
<text class="t" x="36" y="1844">Merge the stacked PRs</text>
<text class="b" x="36" y="1863">In order, first into <tspan class="mono">main</tspan>, each</text>
<text class="b" x="36" y="1880">with a merge commit.</text>
</g>
<path class="arr" d="M340 1856 H298" marker-end="url(#ah)"/>
<text class="al" x="332" y="1850" text-anchor="end">stop</text>
</svg>
