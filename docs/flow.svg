<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
<title id="title">An arc from target to evidence</title><desc id="desc">Owner, architect and executor responsibilities in the command-center flow. Root changes inputs by exported CAS; executable evidence gates publication and milestone review. Backend schemas have plain object roots and supported field constraints; property descriptions state remaining rules. Walk evidence entries are exact saved file paths. Free real-output replays guard schema/parser agreement. Walk breaks require failed product actions, interface repairs that rework dependents, or measured declared floor violations. Copy, visuals and diagnostics deviate; sanctioned choices are not findings. Arc items require named ack; unit/host actions close their notices; finding, baseline and pack-review settlements remain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45} .title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:16px}.small{font-size:14px;fill:#475569}.task{stroke:#476581;stroke-width:1.6}.edge{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.msg{stroke-dasharray:7 5}.pool{fill:#fff;stroke:#94a3b8;stroke-width:1.3}</style>
