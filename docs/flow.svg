<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">How an arc runs</title>
<desc id="desc">Three lanes. The owner confirms the vision, answers questions and acknowledges the brief. The architect plans the arc, supervises it and closes it out. The executor reviews the plan, builds and certifies each unit, publishes the tested head, then judges milestones and audits the campaign. Events and findings flow up to the architect; revisions and steering flow down. Numbers match the steps in the README.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b45;text-anchor:middle}
.title{font-size:24px;font-weight:700;text-anchor:start}
.lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
.lane-label{font-size:14px;font-weight:700;fill:#475569;letter-spacing:.06em}
.box{stroke:#476581;stroke-width:1.5}
.owner{fill:#fff6de}.architect{fill:#f0f7ff}.executor{fill:#f3f8f4}
.name{font-size:16px;font-weight:700}
.what{font-size:13px;fill:#475569}
.note{font-size:12px;fill:#475569}
.edge{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}
.msg{stroke-dasharray:6 5}
.both{marker-start:url(#arrow)}
</style>
<rect width="1200" height="540" fill="#fff"/>
<text x="30" y="40" class="title">How an arc runs</text>

<!-- lanes -->
<rect x="30" y="65" width="1140" height="105" rx="6" class="lane"/>
<rect x="30" y="185" width="1140" height="125" rx="6" class="lane"/>
<rect x="30" y="325" width="1140" height="185" rx="6" class="lane"/>
<text x="55" y="118" class="lane-label" transform="rotate(-90 55 118)">OWNER</text>
<text x="55" y="248" class="lane-label" transform="rotate(-90 55 248)">ARCHITECT</text>
<text x="55" y="418" class="lane-label" transform="rotate(-90 55 418)">EXECUTOR</text>

<!-- owner -->
<rect x="100" y="88" width="230" height="60" rx="10" class="box owner"/>
<text x="215" y="124" class="name">Confirm the vision</text>
<rect x="505" y="88" width="230" height="60" rx="10" class="box owner"/>
<text x="620" y="124" class="name">Answer questions</text>
<rect x="910" y="88" width="230" height="60" rx="10" class="box owner"/>
<text x="1025" y="124" class="name">Acknowledge the brief</text>

<!-- architect -->
<rect x="100" y="212" width="230" height="72" rx="10" class="box architect"/>
<text x="215" y="243" class="name">1 · Plan</text>
<text x="215" y="264" class="what">Target rules, units, proof</text>
<rect x="455" y="212" width="330" height="72" rx="10" class="box architect"/>
<text x="620" y="243" class="name">6 · Supervise</text>
<text x="620" y="264" class="what">Watch, decide, revise the plan</text>
<rect x="910" y="212" width="230" height="72" rx="10" class="box architect"/>
<text x="1025" y="243" class="name">7 · Close out</text>
<text x="1025" y="264" class="what">Pull request, brief, demo</text>

<!-- executor -->
<rect x="100" y="368" width="230" height="72" rx="10" class="box executor"/>
<text x="215" y="399" class="name">2 · Review</text>
<text x="215" y="420" class="what">Check the plan before work starts</text>
<rect x="370" y="368" width="230" height="72" rx="10" class="box executor"/>
<text x="485" y="399" class="name">3 · Build and certify</text>
<text x="485" y="420" class="what">One isolated worktree per unit</text>
<rect x="640" y="368" width="230" height="72" rx="10" class="box executor"/>
<text x="755" y="399" class="name">4 · Publish</text>
<text x="755" y="420" class="what">Only the exact tested head</text>
<rect x="910" y="368" width="230" height="72" rx="10" class="box executor"/>
<text x="1025" y="399" class="name">5 · Judge</text>
<text x="1025" y="420" class="what">Milestone walks, campaign audit</text>

<!-- sequence -->
<path d="M330 248H453" class="edge"/>
<path d="M785 248H908" class="edge"/>
<path d="M330 404H368" class="edge"/>
<path d="M600 404H638" class="edge"/>
<path d="M870 404H908" class="edge"/>

<!-- fix rounds -->
<path d="M545 440V472H425V442" class="edge"/>
<text x="485" y="492" class="note">fix rounds until tests and gate pass</text>

<!-- messages -->
<path d="M215 148V210" class="edge msg"/>
<path d="M215 284V366" class="edge msg"/>
<text x="228" y="330" class="note" style="text-anchor:start">plan</text>
<path d="M620 210V150" class="edge msg both"/>
<path d="M490 366V286" class="edge msg"/>
<text x="478" y="330" class="note" style="text-anchor:end">events and findings</text>
<path d="M570 284V366" class="edge msg"/>
<text x="583" y="330" class="note" style="text-anchor:start">revisions and steering</text>
<path d="M1025 366V286" class="edge msg"/>
<text x="1038" y="330" class="note" style="text-anchor:start">evidence</text>
<path d="M1025 210V150" class="edge msg"/>
</svg>
