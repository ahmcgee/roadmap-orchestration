<polyline points="725,735 725,695 820,695 820,430" class="edge msg"/>
<text x="1080" y="710" class="small" text-anchor="middle"><tspan x="1080" dy="0">findings return to root</tspan></text>
<text x="630" y="885" class="small" text-anchor="middle"><tspan x="630" dy="0">Fix rounds retain findings, lane failures, base comparisons, notes and allowance/cap state.</tspan><tspan x="630" dy="20">Judgments start fresh; one invalid answer repairs in its own session. Directives require revise.</tspan><tspan x="630" dy="20">Schema rules + saved evidence; breaks require failed actions, interface rework or declared floors.</tspan></text>
<rect x="60" y="940" width="1380" height="90" rx="4" fill="#fff" class="task"/>
<text x="85" y="964" class="small" text-anchor="start"><tspan x="85" dy="0">Fixed diagnosis 8 builds / 20 judged attempts; hard stop 16 / 40. Expectations are forecasts, never spend caps.</tspan><tspan x="85" dy="22">Unit/host actions close notices. Arc items need named ack; findings, baselines and pack reviews have documented settlements.</tspan><tspan x="85" dy="22">Watch: --replace / --stop; openBlocking on every wake; confirm supervision live. 30-minute heartbeat; at most 3 chat lines; operator log.</tspan></text>
</svg>
