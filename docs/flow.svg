<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1306" viewBox="0 0 1100 1306" role="img" aria-labelledby="title desc">
<title id="title">How a roadmap-orchestrator arc runs</title>
<desc id="desc">A swimlane flowchart in three lanes: you (the owner), the architect (Claude in your session, running the orchestrate and vision skills) and the executor (a detached Node process that runs unattended and calls models for judgment). It runs in four phases: a one-time bootstrap where you write the target state and confirm the vision; Phase 0 each arc, where the architect plans the arc and starts the executor; the unattended run, where the executor builds, tests, reviews and merges units in parallel while the architect adjudicates what it hands over; and completion, where the architect checks in with you, opens a stacked PR and either chains into the next arc or stops.</desc>
<style>
svg { 
  --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f;
  --ow:#b45309; --ow-fill:#fff7ed; --ow-lane:#fffaf3;
  --ar:#4338ca; --ar-fill:#eef2ff; --ar-lane:#f7f8ff;
  --ex:#047857; --ex-fill:#ecfdf5; --ex-lane:#f5fcf8; --step:#ffffff;
  --chip:#7c3aed; --chip-fg:#ffffff; --note:#f6f8fa; }
@media (prefers-color-scheme: dark) { svg { 
  --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#6e7681;
  --ow:#f59e0b; --ow-fill:#2b1d0a; --ow-lane:#17130c;
  --ar:#a5b4fc; --ar-fill:#1e1b4b; --ar-lane:#12122a;
  --ex:#34d399; --ex-fill:#0b2a1f; --ex-lane:#0c1a15; --step:#0d1117;
  --chip:#a78bfa; --chip-fg:#0d1117; --note:#161b22; } }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: var(--fg); }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
.bg { fill: var(--bg); }
.h1 { font-size: 22px; font-weight: 700; }
.sub, .lg, .ls { font-size: 13px; fill: var(--muted); }
.lt { font-size: 15px; font-weight: 700; }
.lt.ow { fill: var(--ow); } .lt.ar { fill: var(--ar); } .lt.ex { fill: var(--ex); }
.lane.ow { fill: var(--ow-lane); } .lane.ar { fill: var(--ar-lane); } .lane.ex { fill: var(--ex-lane); }
.box rect { stroke-width: 1.5; }
.box.ow rect { fill: var(--ow-fill); stroke: var(--ow); }
.box.ar rect { fill: var(--ar-fill); stroke: var(--ar); }
.box.ex rect { fill: var(--ex-fill); stroke: var(--ex); }
.box.step rect { fill: var(--step); stroke: var(--ex); stroke-width: 1; }
.box.note rect { fill: var(--note); stroke: var(--line); stroke-dasharray: 4 3; }
.box.note .t { fill: var(--muted); }
.t { font-size: 14px; font-weight: 600; }
.t.ex { fill: var(--ex); }
.b { font-size: 13px; }
.chip, .box rect.chip { fill: var(--chip); stroke: none; }
.chipt { font-size: 11px; font-weight: 600; fill: var(--chip-fg); }
.arr { fill: none; stroke: var(--line); stroke-width: 1.6; }
.arr.dash { stroke-dasharray: 5 4; }
#ah path { fill: var(--line); }
.al { font-size: 12px; fill: var(--muted); font-style: italic; }
.band { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.bandpill { fill: var(--fg); }
.bandt { font-size: 12px; font-weight: 700; fill: var(--bg); letter-spacing: 0.06em; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" width="1100" height="1306"/>
<text class="h1" x="24" y="40">How a roadmap-orchestrator arc runs</text>
<text class="sub" x="24" y="64">Who does what, top to bottom. Steps 2–4 repeat for each arc.</text>
<g class="box ow"><rect x="24" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="48" y="97">You</text>
<g class="box ar"><rect x="95.3" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="119.3" y="97">Architect (AI)</text>
<g class="box ex"><rect x="244.7" y="84" width="16" height="16" rx="4"/></g>
<text class="lg" x="268.7" y="97">Executor (code)</text>
<rect class="chip" x="401.2" y="83" width="58" height="18" rx="9"/><text class="chipt" x="430.2" y="96" text-anchor="middle">model</text>
<text class="lg" x="467.2" y="97">the executor calls a model</text>
<rect class="lane ow" x="16" y="118" width="288" height="1178" rx="12"/>
<text class="lt ow" x="28" y="142">You</text>
<text class="ls" x="28" y="160">the owner</text>
<rect class="lane ar" x="332" y="118" width="356" height="1178" rx="12"/>
<text class="lt ar" x="344" y="142">Architect</text>
<text class="ls" x="344" y="160">Claude in your session</text>
<rect class="lane ex" x="716" y="118" width="368" height="1178" rx="12"/>
<text class="lt ex" x="728" y="142">Executor</text>
<text class="ls" x="728" y="160">detached, unattended</text>
<line class="band" x1="16" y1="186" x2="1084" y2="186"/>
<rect class="bandpill" x="16" y="174" width="260.79999999999995" height="24" rx="12"/>
<text class="bandt" x="30" y="190.5">1  ONCE PER REPO: BOOTSTRAP</text>
<g class="box ow">
<rect x="24" y="214" width="272" height="57" rx="8"/>
<text class="t" x="36" y="239">Write the target state</text>
<text class="b" x="36" y="258">then run <tspan class="mono">/vision</tspan></text>
</g>
<g class="box ar">
<rect x="340" y="214" width="340" height="57" rx="8"/>
<text class="t" x="352" y="239">Distil the vision</text>
<text class="b" x="352" y="258">dialogue, then playback</text>
</g>
<path class="arr" d="M296 242.5 H338" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="293" width="272" height="57" rx="8"/>
<text class="t" x="36" y="318">Confirm the vision</text>
<text class="b" x="36" y="337">set K, pick the first slice</text>
</g>
<path class="arr" d="M340 259 H318 V309 H298" marker-end="url(#ah)"/>
<g class="box ar">
<rect x="340" y="293" width="340" height="57" rx="8"/>
<text class="t" x="352" y="318">Bootstrap the repo</text>
<text class="b" x="352" y="337">commit <tspan class="mono">.roadmap/</tspan></text>
</g>
<path class="arr" d="M296 336 H338" marker-end="url(#ah)"/>
<line class="band" x1="16" y1="390" x2="1084" y2="390"/>
<rect class="bandpill" x="16" y="378" width="196.39999999999998" height="24" rx="12"/>
<text class="bandt" x="30" y="394.5">2  EACH ARC: PHASE 0</text>
<g class="box ar">
<rect x="340" y="418" width="340" height="57" rx="8"/>
<text class="t" x="352" y="443">Plan the arc</text>
<text class="b" x="352" y="462">corpus → rules → obligations → specs</text>
</g>
<g class="box ar">
<rect x="340" y="493" width="340" height="57" rx="8"/>
<text class="t" x="352" y="518">Check, then start</text>
<text class="b" x="352" y="537"><tspan class="mono">roadmap phase0 check</tspan>, <tspan class="mono">roadmap start</tspan></text>
</g>
<path class="arr" d="M510 475 V491" marker-end="url(#ah)"/>
<g class="box ex">
<rect x="724" y="493" width="352" height="57" rx="8"/>
<text class="t" x="736" y="518">Validate and launch</text>
<text class="b" x="736" y="537">smoke backends, take host lock</text>
</g>
<path class="arr" d="M680 521.5 H722" marker-end="url(#ah)"/>
<line class="band" x1="16" y1="590" x2="1084" y2="590"/>
<rect class="bandpill" x="16" y="578" width="251.6" height="24" rx="12"/>
<text class="bandt" x="30" y="594.5">3  THE ARC RUNS UNATTENDED</text>
<g class="box ex">
<rect x="724" y="618" width="352" height="40" rx="8"/>
<text class="t" x="736" y="643">Pack review</text>
<rect class="chip" x="1010" y="626" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="639" text-anchor="middle">model</text>
</g>
<g class="box ex"><rect x="724" y="678" width="352" height="252" rx="8"/></g>
<text class="t ex" x="736" y="702">Each unit, in parallel</text>
<g class="box step"><rect x="740" y="716" width="262" height="30" rx="6"/></g>
<text class="t" x="750" y="736">Plan-check</text>
<rect class="chip" x="938" y="722" width="58" height="18" rx="9"/><text class="chipt" x="967" y="735" text-anchor="middle">model</text>
<g class="box step"><rect x="740" y="758" width="262" height="30" rx="6"/></g>
<text class="t" x="750" y="778">Build in a worktree</text>
<rect class="chip" x="938" y="764" width="58" height="18" rx="9"/><text class="chipt" x="967" y="777" text-anchor="middle">model</text>
<path class="arr" d="M780 746 V756" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="800" width="262" height="30" rx="6"/></g>
<text class="t" x="750" y="820">Lanes: tests, witnesses</text>
<path class="arr" d="M780 788 V798" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="842" width="262" height="30" rx="6"/></g>
<text class="t" x="750" y="862">Gate</text>
<rect class="chip" x="938" y="848" width="58" height="18" rx="9"/><text class="chipt" x="967" y="861" text-anchor="middle">model</text>
<path class="arr" d="M780 830 V840" marker-end="url(#ah)"/>
<g class="box step"><rect x="740" y="884" width="262" height="30" rx="6"/></g>
<text class="t" x="750" y="904">Publish to the arc branch</text>
<path class="arr" d="M780 872 V882" marker-end="url(#ah)"/>
<path class="arr" d="M1002 815 H1028 V773 H1004" marker-end="url(#ah)"/>
<line class="arr" x1="1002" y1="857" x2="1028" y2="857"/>
<line class="arr" x1="1028" y1="857" x2="1028" y2="815"/>
<text class="al" x="1034" y="811">fix</text>
<text class="al" x="1034" y="825">round</text>
<path class="arr" d="M764 658 V676" marker-end="url(#ah)"/>
<g class="box ex">
<rect x="724" y="946" width="352" height="57" rx="8"/>
<text class="t" x="736" y="971">Checkpoint</text>
<rect class="chip" x="1010" y="954" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="967" text-anchor="middle">model</text>
<text class="b" x="736" y="990">steers toward the vision</text>
</g>
<g class="box ex">
<rect x="724" y="1015" width="352" height="57" rx="8"/>
<text class="t" x="736" y="1040">Flow loop</text>
<rect class="chip" x="1010" y="1023" width="58" height="18" rx="9"/>
<text class="chipt" x="1039" y="1036" text-anchor="middle">model</text>
<text class="b" x="736" y="1059">tunes how the arc runs</text>
</g>
<g class="box ar">
<rect x="340" y="618" width="340" height="57" rx="8"/>
<text class="t" x="352" y="643">Wait for a wake</text>
<text class="b" x="352" y="662"><tspan class="mono">roadmap watch --actionable</tspan></text>
</g>
<g class="box ar">
<rect x="340" y="753" width="340" height="40" rx="8"/>
<text class="t" x="352" y="778">Adjudicate items</text>
</g>
<g class="box ar">
<rect x="340" y="819" width="340" height="57" rx="8"/>
<text class="t" x="352" y="844">Steer</text>
<text class="b" x="352" y="863"><tspan class="mono">apply</tspan>, <tspan class="mono">steer</tspan>, <tspan class="mono">reverse</tspan>, <tspan class="mono">pause</tspan></text>
</g>
<path class="arr" d="M510 675 V751" marker-end="url(#ah)"/>
<path class="arr" d="M510 793 V817" marker-end="url(#ah)"/>
<path class="arr dash" d="M724 773 H682" marker-end="url(#ah)"/>
<text class="al" x="690" y="767" text-anchor="start">items</text>
<path class="arr" d="M680 847.5 H722" marker-end="url(#ah)"/>
<text class="al" x="690" y="841.5" text-anchor="start">apply</text>
<g class="box note">
<rect x="24" y="618" width="272" height="40" rx="8"/>
<text class="t" x="36" y="643">Away</text>
</g>
<g class="box ow">
<rect x="24" y="753" width="272" height="57" rx="8"/>
<text class="t" x="36" y="778">Answer a question</text>
<text class="b" x="36" y="797">any time</text>
</g>
<path class="arr dash" d="M296 773 H338" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="819" width="272" height="57" rx="8"/>
<text class="t" x="36" y="844">Approve</text>
<text class="b" x="36" y="863">irreversible, &gt;$10, legal</text>
</g>
<path class="arr dash" d="M340 847.5 H298" marker-end="url(#ah)"/>
<line class="band" x1="16" y1="1112" x2="1084" y2="1112"/>
<rect class="bandpill" x="16" y="1100" width="352.79999999999995" height="24" rx="12"/>
<text class="bandt" x="30" y="1116.5">4  ARC COMPLETE: CHECK IN, THEN CHAIN</text>
<g class="box ex">
<rect x="724" y="1140" width="352" height="57" rx="8"/>
<text class="t" x="736" y="1165">Arc complete</text>
<text class="b" x="736" y="1184">opens a stacked PR</text>
</g>
<g class="box ar">
<rect x="340" y="1140" width="340" height="57" rx="8"/>
<text class="t" x="352" y="1165">Check in</text>
<text class="b" x="352" y="1184"><tspan class="mono">roadmap brief</tspan> + questions</text>
</g>
<path class="arr dash" d="M724 1168.5 H682" marker-end="url(#ah)"/>
<text class="al" x="690" y="1162.5" text-anchor="start">wake</text>
<g class="box ow">
<rect x="24" y="1140" width="272" height="57" rx="8"/>
<text class="t" x="36" y="1165">Read and acknowledge</text>
<text class="b" x="36" y="1184">answer what only you can</text>
</g>
<path class="arr dash" d="M340 1168.5 H298" marker-end="url(#ah)"/>
<g class="box ar">
<rect x="340" y="1219" width="340" height="57" rx="8"/>
<text class="t" x="352" y="1244">Next arc, or stop</text>
<text class="b" x="352" y="1263">↺ next arc: back to 2</text>
</g>
<path class="arr" d="M510 1197 V1217" marker-end="url(#ah)"/>
<g class="box ow">
<rect x="24" y="1219" width="272" height="40" rx="8"/>
<text class="t" x="36" y="1244">Merge the stacked PRs</text>
</g>
<path class="arr" d="M340 1247.5 H298" marker-end="url(#ah)"/>
<text class="al" x="332" y="1241.5" text-anchor="end">stop</text>
</svg>
