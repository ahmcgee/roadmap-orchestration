# Reference copy shipped with the roadmap-orchestrator skill. At Phase 0 (issue mode) the bootstrap
# agent copies this into the target repo's .github/ISSUE_TEMPLATE/ and opens a PR the user merges —
# a GitHub issue template is only active once it lives on the default branch.
name: Report a bug or problem
description: Report something that's broken or wrong. Picked up at the next Phase 0 (between sessions) and, during a live arc, at the next wave boundary — never injected into a running unit.
title: "[bug] "
labels: ["roadmap:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a **defect** — something that behaves wrong or is broken. It is read at the **next Phase 0** (so you can file it between sessions) and, if an arc is already running, at the **next wave boundary** — it never interrupts or reroutes a unit that is currently building. The architect adjudicates it like any candidate work: adopt as a fix, fold into an existing unit, defer, or decline with a reason. Reference a specific unit with `#<issue-number>` where it helps. Wanting *new* work rather than reporting a defect? File a **[unit] proposal** instead.
  - type: textarea
    id: did
    attributes:
      label: What I did
      description: The steps, command, or URL that led here.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What I observed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
  - type: dropdown
    id: severity
    attributes:
      label: How much it matters
      options:
        - blocker
        - major
        - minor
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Area / page / unit (e.g. a unit issue like #123).
