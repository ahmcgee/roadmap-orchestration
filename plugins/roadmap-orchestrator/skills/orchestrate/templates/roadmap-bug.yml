# Reference copy shipped with the roadmap-orchestrator skill. Committed under .github/ISSUE_TEMPLATE/ on the
# default branch (GitHub reads templates only there), it labels a defect report `roadmap:bug`, which the
# orchestrator reads at each Phase 0 and at each checkpoint of a running arc. Intake runs only while issue
# creation is limited to collaborators (or the repo is private).
name: Report a bug or problem
description: Report something that is broken or wrong. Read at the next Phase 0 and, while an arc runs, at its next checkpoint. It never interrupts a unit that is building.
title: "[bug] "
labels: ["roadmap:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a **defect**: something that behaves wrong or is broken. It is read at the **next Phase 0** (file it between sessions if you like) and, while an arc runs, at its **next checkpoint**. It never interrupts a unit that is building. Each report gets one recorded outcome: a finding, a corpus amendment, a change to the plan, or no action with a reason. Wanting new work, or something to change direction? File **feedback** instead.
  - type: textarea
    id: did
    attributes:
      label: What I did
      description: The steps, command, or URL that led here.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What I observed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
  - type: dropdown
    id: severity
    attributes:
      label: How much it matters
      options:
        - blocker
        - major
        - minor
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The area, page or command.
